version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: logicq-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: logicq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logicq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: logicq-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  judge:
    build:
      context: .
      dockerfile: Dockerfile.judge
    container_name: logicq-judge
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      PORT: 5050
      NODE_ENV: production
      JUDGE_TMP_ROOT: /judge-tmp
      JUDGE_SERVICE_SECRET: dev_local_judge_secret_2026
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:5050/health\").then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: logicq-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      judge:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/logicq
      JUDGE_TYPE: remote
      JUDGE_SERVICE_URL: http://judge:5050
      JUDGE_SERVICE_SECRET: dev_local_judge_secret_2026
      JWT_ACCESS_SECRET: dev_jwt_access_secret_persistent_key_2026_fixed
      JWT_REFRESH_SECRET: dev_jwt_refresh_secret_persistent_key_2026_fixed
      REDIS_URL: redis://redis:6379

volumes:
  postgres_data:
  redis_data:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 8)">
    <rect width="64" height="64" rx="16" fill="#0E1422" stroke="#1E2942" stroke-width="1.5" />
    
    <!-- Q Ring -->
    <circle cx="30" cy="28" r="16" stroke="url(#logoGrad)" stroke-width="5" stroke-linecap="round" filter="url(#logoGlow)" />
    
    <!-- Internal Prompt ">_" -->
    <path d="M 24 24 L 29 28 L 24 32" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="32" y1="32" x2="37" y2="32" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Q Cursor Tail -->
    <path d="M 39 37 L 50 48 M 45 48 L 50 48 L 50 43" stroke="url(#logoGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)" />
  </g>

  <!-- Wordmark "LogicQ" -->
  <text x="88" y="44" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Logic<tspan fill="url(#logoGrad)">Q</tspan>
  </text>
  
  <!-- Monospace Tagline -->
  <text x="90" y="60" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="1.2">
    &gt; THINK IN LOGIC. CODE IN C.
  </text>
</svg>

<!doctype html>
<html lang="en-IN" class="overflow-x-hidden">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="LogicQ is an institutional continuous evaluation platform for C programming, automated GCC sandboxing, real-time code execution, and proctoring telemetry." />
    <meta name="keywords" content="LogicQ, C Programming, GCC, Code Arena, Online Compiler, Computer Science, Continuous Evaluation" />
    <meta name="author" content="LogicQ Team" />
    <meta property="og:title" content="LogicQ — Smart C Programming &amp; Assessment Platform" />
    <meta property="og:description" content="Think in logic. Code in C. Official low-level systems programming and continuous evaluation platform." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://logicq-clanguage.web.app" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LogicQ — Smart C Programming Platform" />
    <meta name="twitter:description" content="Think in logic. Code in C. Advanced C programming practice arena." />
    <meta name="twitter:image" content="/icons/icon-512.png" />
    <meta name="theme-color" content="#0C0F1F" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4F6FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#F4F6FB" id="meta-theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LogicQ" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('logicq_theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(theme);
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
          var meta = document.getElementById('meta-theme-color');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#0C0F1F' : '#F4F6FB');
          }
        } catch (e) {}
      })();
    </script>
    <title>LogicQ — Smart C Programming &amp; Continuous Assessment Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />
  </head>
  <body class="min-h-screen font-sans antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('logicq_theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(theme);
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
          var meta = document.getElementById('meta-theme-color');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#0C0F1F' : '#F4F6FB');
          }
        } catch (e) {}

        // Automatic Self-Healing: detect stale bundle / chunk load failures on mobile & reload
        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? e.message.toLowerCase() : '';
          var src = (e && e.filename) ? e.filename.toLowerCase() : '';
          var isChunkError = (
            msg.indexOf('dynamically imported module') !== -1 ||
            msg.indexOf('loading chunk') !== -1 ||
            msg.indexOf('unexpected token') !== -1 ||
            msg.indexOf('failed to fetch') !== -1 ||
            src.indexOf('/assets/') !== -1
          );

          if (isChunkError) {
            var hasRetried = sessionStorage.getItem('logicq_chunk_retry');
            if (!hasRetried) {
              sessionStorage.setItem('logicq_chunk_retry', 'true');
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  for (var i = 0; i < regs.length; i++) {
                    regs[i].unregister();
                  }
                  if ('caches' in window) {
                    caches.keys().then(function(names) {
                      for (var j = 0; j < names.length; j++) {
                        caches.delete(names[j]);
                      }
                      window.location.reload(true);
                    });
                  } else {
                    window.location.reload(true);
                  }
                });
              } else {
                window.location.reload(true);
              }
            }
          }
        }, true);
      })();
    </script>
    <title>LogicQ — Smart C Programming &amp; Continuous Assessment Platform</title>

    <style>
      /* Inline critical splash loader styling with dynamic theme support */
      #app-boot-loader {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
        text-align: center;
        box-sizing: border-box;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      html.dark #app-boot-loader,
      html[data-theme="dark"] #app-boot-loader {
        background-color: #0c0f1f;
        color: #f1f5f9;
      }

      .boot-logo-wrapper {
        position: relative;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-logo-box {
        position: relative;
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: #ffffff;
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 0 20px rgba(139, 155, 255, 0.18);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        z-index: 2;
        box-sizing: border-box;
      }
      html.dark .boot-logo-box,
      html[data-theme="dark"] .boot-logo-box {
        background: #141932;
        border-color: rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5), 0 0 24px rgba(70, 217, 160, 0.18);
      }
      .boot-logo-pulse {
        position: absolute;
        width: 88px;
        height: 88px;
        border-radius: 26px;
        background: radial-gradient(circle, rgba(139, 155, 255, 0.35) 0%, rgba(70, 217, 160, 0.22) 55%, transparent 75%);
        animation: bootPulse 2.2s ease-in-out infinite;
        z-index: 1;
      }
      @keyframes bootPulse {
        0% { transform: scale(0.92); opacity: 0.5; }
        50% { transform: scale(1.18); opacity: 0.85; }
        100% { transform: scale(0.92); opacity: 0.5; }
      }
      .boot-logo-svg {
        width: 100%;
        height: 100%;
      }
      .boot-title {
        font-size: 22px;
        font-weight: 800;
        color: #0f172a;
        margin: 0 0 6px 0;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1px;
      }
      html.dark .boot-title,
      html[data-theme="dark"] .boot-title {
        color: #f1f5f9;
      }
      .boot-subtitle {
        font-size: 13px;
        color: #64748b;
        margin: 0 0 16px 0;
        font-weight: 500;
      }
      html.dark .boot-subtitle,
      html[data-theme="dark"] .boot-subtitle {
        color: #94a3b8;
      }
      .boot-progress-bar {
        width: 140px;
        height: 3.5px;
        background: rgba(148, 163, 184, 0.25);
        border-radius: 9999px;
        overflow: hidden;
        margin: 4px auto 20px auto;
        position: relative;
      }
      .boot-progress-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        background: linear-gradient(90deg, #8B9BFF, #46D9A0);
        border-radius: 9999px;
        animation: bootProgress 1.3s ease-in-out infinite;
      }
      @keyframes bootProgress {
        0% { left: -50%; width: 30%; }
        50% { left: 30%; width: 55%; }
        100% { left: 110%; width: 30%; }
      }
      .boot-repair-btn {
        display: none;
        background: linear-gradient(135deg, #4f46e5, #4338ca);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 10px 20px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
        transition: transform 0.15s ease, opacity 0.2s ease;
      }
      .boot-repair-btn:active {
        transform: scale(0.97);
      }
    </style>

  <body class="min-h-screen font-sans antialiased overflow-x-hidden">
    <div id="root">

        <div class="boot-logo-wrapper">

              <defs>
                <linearGradient id="bootLogoQGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#8B9BFF" />
                  <stop offset="100%" stop-color="#46D9A0" />
                </linearGradient>
              </defs>
              <circle
                cx="48"
                cy="44"
                r="28"
                stroke="url(#bootLogoQGrad)"

                stroke-linecap="round"

              <path

              <line

                x2="59"
                y2="50"

                stroke-width="4.5"
                stroke-linecap="round"
              />
              <path
                d="M 64 60 L 80 76 M 73 76 L 80 76 L 80 69"
                stroke="url(#bootLogoQGrad)"
                stroke-width="8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
        </div>
        <div class="boot-title">
          <span>Logic</span><span style="color: #10b981;">Q</span>
        </div>
        <div class="boot-subtitle">C Programming &amp; Continuous Assessment Arena</div>
        <div class="boot-progress-bar">
          <div class="boot-progress-fill"></div>
        </div>
        <button
          id="boot-repair-btn"
          class="boot-repair-btn"
          onclick="(function(){
            try {
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  for (var i = 0; i < regs.length; i++) regs[i].unregister();
                  if ('caches' in window) {
                    caches.keys().then(function(names) {
                      for (var j = 0; j < names.length; j++) caches.delete(names[j]);
                      sessionStorage.clear();
                      window.location.reload(true);
                    });
                  } else {
                    sessionStorage.clear();
                    window.location.reload(true);
                  }
                });
              } else {
                sessionStorage.clear();
                window.location.reload(true);
              }
            } catch (err) {
              window.location.reload(true);
            }
          })()"
        >
          Tap to Refresh &amp; Clear Cache
        </button>
      </div>
      <script>
        // Reveal emergency recovery button if React hasn't mounted in 3.5 seconds
        setTimeout(function() {
          var btn = document.getElementById('boot-repair-btn');
          if (btn) btn.style.display = 'inline-block';
        }, 3500);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>

    <meta name="theme-color" content="#F4F6FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#F4F6FB" id="meta-theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LogicQ" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('logicq_theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(theme);
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
          var meta = document.getElementById('meta-theme-color');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#0C0F1F' : '#F4F6FB');
          }
        } catch (e) {}

        // Automatic Self-Healing: detect stale bundle / chunk load failures on mobile & reload
        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? e.message.toLowerCase() : '';
          var src = (e && e.filename) ? e.filename.toLowerCase() : '';
          var isChunkError = (
            msg.indexOf('dynamically imported module') !== -1 ||
            msg.indexOf('loading chunk') !== -1 ||
            msg.indexOf('unexpected token') !== -1 ||
            msg.indexOf('failed to fetch') !== -1 ||
            src.indexOf('/assets/') !== -1
          );

          if (isChunkError) {
            var hasRetried = sessionStorage.getItem('logicq_chunk_retry');
            if (!hasRetried) {
              sessionStorage.setItem('logicq_chunk_retry', 'true');
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  for (var i = 0; i < regs.length; i++) {
                    regs[i].unregister();
                  }
                  if ('caches' in window) {
                    caches.keys().then(function(names) {
                      for (var j = 0; j < names.length; j++) {
                        caches.delete(names[j]);
                      }
                      window.location.reload(true);
                    });
                  } else {
                    window.location.reload(true);
                  }
                });
              } else {
                window.location.reload(true);
              }
            }
          }
        }, true);
      })();
    </script>
    <title>LogicQ — Smart C Programming &amp; Continuous Assessment Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <style>
      /* Inline critical splash loader styling to prevent black screen on mobile */
      #app-boot-loader {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0c0f1f;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
        text-align: center;
        box-sizing: border-box;
      }
      .loader {
        --sizeVar: clamp(54px, 8vmin, 72px);
        position: relative;
        width: var(--sizeVar);
        height: var(--sizeVar);
        animation: loaderRotate 2000ms ease-in-out infinite;
        margin-bottom: 28px;
      }
      .loader::before {
        content: "";
        position: absolute;
        width: 200%;
        height: 200%;
        top: -50%;
        left: -50%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.2) 0%,
          rgba(255, 255, 255, 0) 70%
        );
        pointer-events: none;
      }
      .loader-square {
        position: absolute;
        width: 45%;
        height: 45%;
        background-color: #f25022;
        border-radius: 4px;
        transform-origin: center;
        animation: squareAnim 4000ms cubic-bezier(1, 0, 0, 1) infinite,
          squareBlink 1000ms ease-in-out infinite;
        box-shadow: 0 0 8px #f25022aa, 0 0 32px #f2502277;
      }
      .loader-square:nth-of-type(2) {
        background-color: #7fba02;
        box-shadow: 0 0 8px #7fba02aa, 0 0 32px #7fba0277;
        animation-delay: -1000ms, -75ms;
      }
      .loader-square:nth-of-type(3) {
        background-color: #ffb902;
        box-shadow: 0 0 8px #ffb902aa, 0 0 32px #ffb90277;
        animation-delay: -2000ms, -150ms;
      }
      .loader-square:nth-of-type(4) {
        background-color: #01a4ef;
        box-shadow: 0 0 8px #01a4efaa, 0 0 32px #01a4ef77;
        animation-delay: -3000ms, -225ms;
      }

      @keyframes squareAnim {
        0% { transform: translate(0, 0); }
        25% { transform: translate(120%, 0); }
        50% { transform: translate(120%, 120%); }
        75% { transform: translate(0, 120%); }
        100% { transform: translate(0, 0); }
      }
      @keyframes squareBlink {
        0% { filter: brightness(110%); }
        20% { filter: brightness(110%); }
        50% { filter: brightness(80%); }
        80% { filter: brightness(110%); }
        100% { filter: brightness(110%); }
      }
      @keyframes loaderRotate {
        0% { transform: scale(1); }
        50% { transform: scale(0.7); }
        100% { transform: scale(1); }
      }
      .boot-title {
        font-size: 17px;
        font-weight: 700;
        color: #f1f5f9;
        margin: 0 0 6px 0;
        letter-spacing: -0.01em;
      }
      .boot-subtitle {
        font-size: 13px;
        color: #64748b;
        margin: 0 0 20px 0;
      }
      .boot-repair-btn {
        display: none;
        background: linear-gradient(135deg, #4f46e5, #4338ca);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 10px 20px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
        transition: transform 0.15s ease, opacity 0.2s ease;
      }
      .boot-repair-btn:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body class="min-h-screen font-sans antialiased overflow-x-hidden">
    <div id="root">
      <div id="app-boot-loader">
        <div class="loader">
          <div class="loader-square"></div>
          <div class="loader-square"></div>
          <div class="loader-square"></div>
          <div class="loader-square"></div>
        </div>
        <div class="boot-title">LogicQ C Programming Arena</div>
        <div class="boot-subtitle">Initializing environment &amp; continuous evaluation...</div>
        <button
          id="boot-repair-btn"
          class="boot-repair-btn"
          onclick="(function(){
            try {
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  for (var i = 0; i < regs.length; i++) regs[i].unregister();
                  if ('caches' in window) {
                    caches.keys().then(function(names) {
                      for (var j = 0; j < names.length; j++) caches.delete(names[j]);
                      sessionStorage.clear();
                      window.location.reload(true);
                    });
                  } else {
                    sessionStorage.clear();
                    window.location.reload(true);
                  }
                });
              } else {
                sessionStorage.clear();
                window.location.reload(true);
              }
            } catch (err) {
              window.location.reload(true);
            }
          })()"
        >
          Tap to Refresh &amp; Clear Cache
        </button>
      </div>
      <script>
        // Reveal emergency recovery button if React hasn't mounted in 3.5 seconds
        setTimeout(function() {
          var btn = document.getElementById('boot-repair-btn');
          if (btn) btn.style.display = 'inline-block';
        }, 3500);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

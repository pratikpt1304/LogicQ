<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="qGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Dark Container -->
  <rect width="100" height="100" rx="24" fill="#090D16" />
  <rect x="1" y="1" width="98" height="98" rx="23" stroke="#1E2942" stroke-width="2" />
  
  <!-- Terminal Prompt Arrow & Q Ring -->
  <circle cx="50" cy="46" r="28" stroke="url(#qGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Inner Terminal Prompt ">_" -->
  <path d="M 40 40 L 48 46 L 40 52" stroke="#00F2FE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="52" y1="52" x2="60" y2="52" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
  
  <!-- Q Tail as Blinking Terminal Cursor / Arrow -->
  <path d="M 64 60 L 80 76 M 74 76 L 80 76 L 80 70" stroke="url(#qGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
